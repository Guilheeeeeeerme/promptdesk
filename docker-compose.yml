services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
      POSTGRES_DB: ${POSTGRES_DB:-support}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dmz_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support} -d ${POSTGRES_DB:-support}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-chat:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_CHAT_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_CHAT_PASSWORD:-support}
      POSTGRES_DB: ${POSTGRES_CHAT_DB:-support_chat}
    volumes:
      - postgres_chat_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - dmz_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CHAT_USER:-support} -d ${POSTGRES_CHAT_DB:-support_chat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - dmz_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-bookworm
    working_dir: /app
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: ${PORT:-3000}
      CHAT_JOB_ATTEMPTS: ${CHAT_JOB_ATTEMPTS:-3}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-20}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app
    networks:
      - dmz_internal
    command:
      - sh
      - -c
      - |
        set -e
        npx prisma migrate deploy
        npx prisma migrate deploy --schema prisma-chat/schema.prisma
        npx prisma db seed
        node dist/main.js
    depends_on:
      postgres:
        condition: service_healthy
      postgres-chat:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-worker:
    image: node:22-bookworm
    working_dir: /apps/chat-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      CHAT_JOB_ATTEMPTS: ${CHAT_JOB_ATTEMPTS:-3}
      MODEL_RANK_REFRESH_MS: ${MODEL_RANK_REFRESH_MS:-300000}
      MODEL_RANK_TOP_N: ${MODEL_RANK_TOP_N:-3}
      CHAT_WORKER_PORT: ${CHAT_WORKER_PORT:-3001}
    ports:
      - "${CHAT_WORKER_PORT:-3001}:3001"
    volumes:
      - ./apps/chat-worker:/apps/chat-worker
      - ./apps/api/prisma:/apps/api/prisma:ro
      - ./apps/api/prisma-chat:/apps/api/prisma-chat:ro
    networks:
      - dmz_internal
    command:
      - sh
      - -c
      - |
        set -e
        # Clients generated on host (scripts/up.sh); volume mounts node_modules.
        node dist/main.js
    depends_on:
      postgres:
        condition: service_healthy
      postgres-chat:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SUPPORT_ORIGIN: ${VITE_SUPPORT_ORIGIN:-http://localhost:8081}
        VITE_SSO_RETURN_ORIGINS: ${SSO_RETURN_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - "8080:80"
    networks:
      - dmz_internal
    depends_on:
      - api

  support:
    build:
      context: ./apps/support
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_MAIN_ORIGIN: ${VITE_MAIN_ORIGIN:-http://localhost:8080}
    ports:
      - "8081:80"
    networks:
      - dmz_internal
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  postgres_chat_data:

networks:
  # Internal service mesh (api ↔ chat-worker ↔ redis ↔ postgres*).
  # Public edge ports stay published for host/browser; S2S traffic stays on this network.
  dmz_internal:
    name: dmz_internal
