services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
      POSTGRES_DB: ${POSTGRES_DB:-support}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support} -d ${POSTGRES_DB:-support}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-bookworm
    working_dir: /app
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - |
        set -e
        npm install --no-audit --no-fund --no-save
        npx prisma generate
        npx prisma migrate deploy
        npx prisma db seed
        npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-bookworm
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_SUPPORT_ORIGIN: ${VITE_SUPPORT_ORIGIN:-http://localhost:8081}
      VITE_SSO_RETURN_ORIGINS: ${SSO_RETURN_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "8080:8080"
    volumes:
      - ./apps/web:/app
      - ./apps/shared:/shared:ro
      - web_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - |
        set -e
        npm install --no-audit --no-fund --no-save
        npm run dev
    depends_on:
      - api

  support:
    image: node:22-bookworm
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_MAIN_ORIGIN: ${VITE_MAIN_ORIGIN:-http://localhost:8080}
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "8081:8081"
    volumes:
      - ./apps/support:/app
      - ./apps/shared:/shared:ro
      - support_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - |
        set -e
        npm install --no-audit --no-fund --no-save
        npm run dev
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
  support_node_modules:
