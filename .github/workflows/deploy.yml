# PromptDesk deploy: test → GHCR build → runner compose smoke → pointer move → webhook → poll /version.
# Contract: immutable :<sha> images + moving :production tag + one Dokploy webhook per release.
# Rollback: workflow_dispatch with `sha` of an older release. `skip_migrations` only affects the
# CI smoke exercise of the rollback switch; on the VPS set SKIP_MIGRATIONS in the Dokploy env
# (see deploy/README.md — stack env lives in the panel, CI cannot inject it via webhook).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to release (empty = current head / default branch)'
        required: false
      skip_migrations:
        description: 'In CI smoke, also run migrate with SKIP_MIGRATIONS=1 first'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-promptdesk
  cancel-in-progress: false

env:
  GHCR_ORG: guilheeeeeeerme
  API_PUBLIC_URL: https://api.promptdesk.ferredemo.dev # override via repo var PROMPTDESK_API_PUBLIC_URL

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [api, chat-worker]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: npm test (apps/${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: |
          npm ci --no-audit --no-fund
          # Generate @prisma/client (+ @prisma/chat-client) before jest —
          # test suites import them directly.
          for schema in prisma/schema.prisma prisma-chat/schema.prisma; do
            if [ -f "$schema" ]; then npx --yes prisma generate --schema "$schema"; fi
          done
          npm test -- --passWithNoTests

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: deploy/docker/api.Dockerfile
          - image: chatworker
            dockerfile: deploy/docker/chatworker.Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - env:
          RELEASE_SHA: ${{ inputs.sha || github.sha }}
        run: echo "RELEASING ${RELEASE_SHA}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          build-args: GIT_SHA=${{ inputs.sha || github.sha }}
          tags: |
            ghcr.io/${{ env.GHCR_ORG }}/promptdesk/${{ matrix.image }}:${{ inputs.sha || github.sha }}
            ghcr.io/${{ env.GHCR_ORG }}/promptdesk/${{ matrix.image }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    env:
      # Throwaway runner-local twin of the Dokploy stack; no real secrets.
      POSTGRES_PASSWORD: ci-superuser-throwaway
      POSTGRES_PROMPTDESK_PASSWORD: ci-promptdesk-throwaway
      POSTGRES_PROMPTDESK_CHAT_PASSWORD: ci-chat-throwaway
      REDIS_PASSWORD: ci-redis-throwaway
      # Throwaway provider creds so fail-closed LLM services boot (they are
      # never invoked in the smoke; values are fake by construction).
      GEMINI_API_KEY: smoke-gemini-key
      LLM_USE_HEADROOM: "true"
      GEMINI_BASE_URL: http://headroom:8787
      DATABASE_URL: postgresql://promptdesk:ci-promptdesk-throwaway@postgres:5432/promptdesk?schema=public
      DATABASE_DIRECT_URL: postgresql://promptdesk:ci-promptdesk-throwaway@postgres:5432/promptdesk?schema=public
      CHAT_DATABASE_URL: postgresql://promptdesk_chat:ci-chat-throwaway@postgres:5432/promptdesk_chat?schema=public
      CHAT_DATABASE_DIRECT_URL: postgresql://promptdesk_chat:ci-chat-throwaway@postgres:5432/promptdesk_chat?schema=public
      # No API_IMAGE/CHATWORKER_IMAGE overrides: smoke pulls :production, which
      # `build` just pointed at the released sha (inputs.sha || github.sha).
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Resolve release sha
        run: echo "RELEASE_SHA=${{ inputs.sha || github.sha }}" >> "$GITHUB_ENV"
      - name: Validate compose renders
        run: docker compose -f deploy/compose.prod.yml config -q
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stand-in external network (Traefik plane on the VPS)
        run: docker network create dokploy-network
      - name: Boot data plane (postgres + redis)
        working-directory: deploy
        run: docker compose -f compose.prod.yml up -d postgres redis
      # Exercise the one-shot migrate service end-to-end: first the rollback
      # switch (SKIP_MIGRATIONS=1 must exit 0 without touching the schema),
      # then the real run (applies both Prisma schemas).
      - name: Migrate with SKIP_MIGRATIONS=1 (must exit 0)
        working-directory: deploy
        env:
          SKIP_MIGRATIONS: '1'
        run: docker compose -f compose.prod.yml --profile migrate run --rm migrate
      - name: Migrate (real run, both schemas)
        working-directory: deploy
        run: docker compose -f compose.prod.yml --profile migrate run --rm migrate
      - name: Boot app plane and wait for health (api + chatworker)
        working-directory: deploy
        env:
          PD_API_MEM_LIMIT: 512m
          PD_CHATWORKER_MEM_LIMIT: 256m
          PD_POSTGRES_MEM_LIMIT: 512m
          PD_REDIS_MEM_LIMIT: 128m
        run: |
          if ! docker compose -f compose.prod.yml up -d --wait --wait-timeout 240 api chatworker; then
            echo "---- api container log ----"
            docker compose -f compose.prod.yml logs api | head -120
            echo "---- chatworker container log ----"
            docker compose -f compose.prod.yml logs chatworker | head -160
            exit 1
          fi
      - name: Smoke /version (runner-local)
        run: |
          set -euo pipefail
          body=$(docker compose -f deploy/compose.prod.yml exec -T api node -e "fetch('http://127.0.0.1:3000/version').then((r)=>r.json()).then((j)=>console.log(JSON.stringify(j)))")
          echo "$body"
          echo "$body" | grep -q '"service":"promptdesk-api"'
          echo "$body" | grep -q "\"gitsha\":\"${RELEASE_SHA}\""

  pointers:
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Moving :production tag. Push-to-main already tags production at the built
      # SHA in `build`; this job re-aims it only for the rollback path (dispatch
      # with sha != head) after smoke has validated that exact image pair.
      - name: Point :production at the built images (rollback / re-assert)
        if: ${{ (inputs.sha || github.sha) != github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "ghcr.io/${GHCR_ORG}/promptdesk/api:production" "ghcr.io/${GHCR_ORG}/promptdesk/api:${{ inputs.sha || github.sha }}"
          docker buildx imagetools create -t "ghcr.io/${GHCR_ORG}/promptdesk/chatworker:production" "ghcr.io/${GHCR_ORG}/promptdesk/chatworker:${{ inputs.sha || github.sha }}"

  webhook:
    needs: pointers
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Dokploy deploy hook (expect 200)
        env:
          DOKPLOY_DEPLOY_HOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$DOKPLOY_DEPLOY_HOOK_URL")
          echo "webhook status: $code"
          [ "$code" = 200 ] || { echo "::error::expected 200 from deploy hook, got $code"; exit 1; }

  poll:
    needs: webhook
    runs-on: ubuntu-24.04
    steps:
      - name: Poll /version until the released git sha is live
        env:
          API_PUBLIC_URL: ${{ vars.PROMPTDESK_API_PUBLIC_URL || env.API_PUBLIC_URL }}
          RELEASE_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          until [ "$SECONDS" -ge "$deadline" ]; do
            body=$(curl -sS --fail-with-body "${API_PUBLIC_URL}/version" || true)
            echo "GET /version → ${body:-<no-response>}"
            if [ -n "${body:-}" ] && echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('gitsha')=='$RELEASE_SHA' else 1)" 2>/dev/null; then
              echo "Released sha ${RELEASE_SHA} is live."; exit 0
            fi
            sleep 15
          done
          echo "::error::/version never reported ${RELEASE_SHA} within 10 minutes"
          exit 1
