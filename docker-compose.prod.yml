services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-support}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support} -d ${POSTGRES_DB:-support}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-chat:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_CHAT_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_CHAT_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_CHAT_DB:-support_chat}
    volumes:
      - postgres_chat_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CHAT_USER:-support} -d ${POSTGRES_CHAT_DB:-support_chat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      network: host
      context: ./apps/api
      dockerfile: Dockerfile
    image: demo-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      postgres-chat:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-worker:
    build:
      network: host
      context: .
      dockerfile: apps/chat-worker/Dockerfile
    image: demo-chat-worker:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      postgres-chat:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      network: host
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SUPPORT_ORIGIN: ${VITE_SUPPORT_ORIGIN}
        VITE_SSO_RETURN_ORIGINS: ${SSO_RETURN_ORIGINS:-}
    image: demo-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - internal

  support:
    build:
      network: host
      context: .
      dockerfile: apps/support/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_MAIN_ORIGIN: ${VITE_MAIN_ORIGIN}
    image: demo-support:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - internal

volumes:
  postgres_data:
  postgres_chat_data:
  redis_data:

networks:
  internal:
    driver: bridge
