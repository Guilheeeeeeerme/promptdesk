stages:
  - verify
  - deploy

default:
  image: node:22-bookworm
  cache:
    key: "deps-$CI_COMMIT_REF_SLUG"
    paths:
      - apps/api/node_modules/
      - apps/chat-worker/node_modules/
      - apps/web/node_modules/
      - apps/support/node_modules/

api:verify:
  stage: verify
  script:
    - cd apps/api
    - npm ci --no-audit --no-fund
    - npx prisma generate --schema prisma/schema.prisma --generator client
    - npx prisma generate --schema prisma-chat/schema.prisma --generator client
    - npm test -- --runInBand
    - npm run build

chat-worker:verify:
  stage: verify
  script:
    - cd apps/chat-worker
    - npm ci --no-audit --no-fund
    - mkdir -p prisma-core prisma-chat
    - cp ../api/prisma/schema.prisma prisma-core/schema.prisma
    - cp ../api/prisma-chat/schema.prisma prisma-chat/schema.prisma
    - npm run prisma:generate
    - npm run build

web:verify:
  stage: verify
  script:
    - cd apps/web
    - npm ci --no-audit --no-fund
    - npm run build

support:verify:
  stage: verify
  script:
    - cd apps/support
    - npm ci --no-audit --no-fund
    - npm run build

deploy:hostinger:
  stage: deploy
  image: alpine:3.21
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "chore/production-deploy"
      when: manual
  script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "cd /opt/demo && bash scripts/deploy.sh $CI_COMMIT_SHA"
